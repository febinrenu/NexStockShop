<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#F4F2ED; color:#12151A; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#1E5FD6; text-decoration:none; }
a:hover { color:#0B1F3F; }
input { box-sizing:border-box; }
</style>
</helmet>
<dc-import name="StoreHeader" lang="{{ lang }}" active="home" cart-count="0" on-set-lang="{{ setLang }}" hint-size="100%,220px"></dc-import>
<main dir="{{ dir }}" style="max-width:1100px; margin:0 auto; padding:clamp(24px,4vw,56px) clamp(16px,4vw,32px) 70px; display:flex; flex-wrap:wrap; gap:clamp(24px,4vw,56px); align-items:stretch; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif;">
  <div style="flex:1 1 340px; background:#0B1F3F; color:#fff; border-radius:24px; padding:clamp(28px,4vw,48px); display:flex; flex-direction:column; justify-content:space-between; gap:28px; position:relative; overflow:hidden; min-height:420px;">
    <div style="position:absolute; inset-inline-end:-90px; bottom:-90px; width:320px; height:320px; border-radius:50%; border:1px solid rgba(255,255,255,0.12);"></div>
    <div style="position:relative;">
      <img src="uploads/nexstck_logo_White.png" alt="NexStock" style="height:36px; width:auto; margin-bottom:28px;">
      <h1 style="margin:0 0 14px; font-size:clamp(28px,3.4vw,42px); font-weight:900; letter-spacing:-0.03em; line-height:1.05;">{{ t.welcomeA }} <span style="font-family:'Instrument Serif','IBM Plex Sans Arabic',serif; font-style:italic; font-weight:400; color:#8FB4F2;">{{ t.welcomeB }}</span></h1>
      <p style="margin:0; font-size:14.5px; line-height:1.7; color:#B9C8E2; max-width:360px; text-wrap:pretty;">{{ t.welcomeSub }}</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; position:relative;">
      <sc-for list="{{ perks }}" as="p" hint-placeholder-count="3">
        <div style="display:flex; gap:12px; align-items:center; font-size:13.5px; color:#C9D6EC;"><span style="width:9px; height:9px; border-radius:50%; background:#8FD3A8; flex-shrink:0;"></span>{{ p }}</div>
      </sc-for>
    </div>
  </div>
  <div style="flex:1 1 340px; background:#FDFCFA; border:1px solid #E7E3DA; border-radius:24px; padding:clamp(28px,4vw,48px); display:flex; flex-direction:column; justify-content:center; gap:18px;">
    <div>
      <h2 style="margin:0 0 6px; font-size:24px; font-weight:900; letter-spacing:-0.02em;">{{ t.title }}</h2>
      <div style="font-size:13.5px; color:#8A857A;">{{ t.sub }} <a href="Register.dc.html" style="font-weight:800;">{{ t.createOne }}</a></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <div style="font-size:12.5px; font-weight:800; margin-bottom:7px;">{{ t.email }}</div>
        <input placeholder="name@email.com" style="width:100%; border:1.5px solid #E3DFD4; border-radius:12px; padding:14px 16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14px; outline:none; background:#F4F2ED;">
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; margin-bottom:7px;"><span style="font-size:12.5px; font-weight:800;">{{ t.password }}</span><a href="#" style="font-size:12px; font-weight:700;">{{ t.forgot }}</a></div>
        <input type="password" placeholder="••••••••" style="width:100%; border:1.5px solid #E3DFD4; border-radius:12px; padding:14px 16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14px; outline:none; background:#F4F2ED;">
      </div>
      <label style="display:flex; align-items:center; gap:9px; font-size:13px; color:#5C594F; cursor:pointer;"><input type="checkbox" style="accent-color:#1E5FD6; width:16px; height:16px;">{{ t.remember }}</label>
    </div>
    <button onClick="{{ doLogin }}" style="width:100%; background:#12151A; color:#fff; border:none; border-radius:999px; padding:16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14.5px; font-weight:800; cursor:pointer;" style-hover="background:#1E5FD6;">{{ t.signInBtn }}</button>
    <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
      <div style="background:#DFE8DC; color:#3E5C38; border-radius:12px; padding:12px 16px; font-size:12.5px; font-weight:700; text-align:center;">{{ t.success }}</div>
    </sc-if>
    <div style="display:flex; align-items:center; gap:14px; color:#B0AA9B; font-size:12px;"><span style="flex:1; height:1px; background:#ECE8DF;"></span>{{ t.or }}<span style="flex:1; height:1px; background:#ECE8DF;"></span></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button style="flex:1 1 130px; border:1.5px solid #E3DFD4; background:#F4F2ED; border-radius:999px; padding:13px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:13px; font-weight:800; cursor:pointer; color:#3B3830;" style-hover="border-color:#1E5FD6;">Google</button>
      <button style="flex:1 1 130px; border:1.5px solid #E3DFD4; background:#F4F2ED; border-radius:999px; padding:13px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:13px; font-weight:800; cursor:pointer; color:#3B3830;" style-hover="border-color:#1E5FD6;">Apple</button>
    </div>
  </div>
</main>
<dc-import name="StoreFooter" lang="{{ lang }}" hint-size="100%,480px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('nexstock-lang')) || 'en', loggedIn: false };
  renderVals() {
    const lang = this.state.lang; const ar = lang === 'ar';
    const T = {
      en: { welcomeA: 'Welcome', welcomeB: 'back.', welcomeSub: 'Sign in to track orders, sync your wishlist and check out faster.', title: 'Sign in', sub: 'New to NexStock?', createOne: 'Create an account', email: 'Email address', password: 'Password', forgot: 'Forgot password?', remember: 'Keep me signed in', signInBtn: 'Sign in', success: '✓ Signed in — redirecting to your account…', or: 'or continue with',
        perks: ['Order tracking to the minute', 'Wishlist synced on all devices', 'Exclusive member-only deals'] },
      ar: { welcomeA: 'أهلاً بعودتك', welcomeB: 'إلينا.', welcomeSub: 'سجّل الدخول لتتبع طلباتك ومزامنة مفضلتك وإتمام الشراء أسرع.', title: 'تسجيل الدخول', sub: 'جديد على نكستوك؟', createOne: 'أنشئ حساباً', email: 'البريد الإلكتروني', password: 'كلمة المرور', forgot: 'نسيت كلمة المرور؟', remember: 'أبقني مسجلاً', signInBtn: 'تسجيل الدخول', success: '✓ تم تسجيل الدخول — جارٍ التحويل إلى حسابك…', or: 'أو تابع باستخدام',
        perks: ['تتبع الطلبات دقيقة بدقيقة', 'مفضلة متزامنة على كل أجهزتك', 'عروض حصرية للأعضاء فقط'] }
    }[lang];
    return {
      lang, dir: ar ? 'rtl' : 'ltr', t: T, perks: T.perks, loggedIn: this.state.loggedIn,
      doLogin: () => this.setState({ loggedIn: true }),
      setLang: (l) => { try { localStorage.setItem('nexstock-lang', l); } catch(e) {} this.setState({ lang: l }); }
    };
  }
}
</script>
</body>
</html>
