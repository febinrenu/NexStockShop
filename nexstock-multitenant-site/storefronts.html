<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefronts — NexStock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .sf-card{border-radius:var(--radius-lg); overflow:hidden; border:1px solid; display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease;}
  .sf-card:hover{transform:translateY(-4px); box-shadow:0 24px 50px rgba(0,0,0,0.14);}
  .sf-hero{padding:clamp(28px,4vw,44px); display:flex; flex-direction:column; gap:14px;}
  .sf-body{padding:22px clamp(20px,3vw,32px) clamp(24px,3vw,32px); flex:1; display:flex; flex-direction:column; gap:16px;}
  .sf-cats{display:flex; flex-wrap:wrap; gap:8px;}
  .sf-cat-chip{font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px;}
  .sf-active-badge{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; padding:5px 12px; border-radius:999px; align-self:flex-start;}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="container" style="display:flex;flex-direction:column;gap:clamp(28px,4vw,44px);">
  <div style="max-width:680px;">
    <div class="eyebrow" id="sf-eyebrow"></div>
    <h1 id="sf-title" style="font-size:clamp(28px,3.6vw,44px);line-height:1.08;margin:8px 0 12px;"></h1>
    <p id="sf-sub" style="margin:0;font-size:14.5px;line-height:1.7;color:var(--muted2);"></p>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:26px;" id="sf-grid"></div>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome('');
const ar = isAr();
$('sf-eyebrow').textContent = ar ? 'وضع متعدد المستأجرين · عرض توضيحي' : 'Multi-tenant demo · TrippleShop 2.0';
$('sf-title').textContent = ar ? 'اختر متجراً لزيارته' : 'Choose a storefront to visit';
$('sf-sub').textContent = ar
  ? 'نفس المنصة، متاجر مختلفة تماماً: كل مستأجر له فئاته ومنتجاته وألوانه وخطوطه الخاصة. اختر متجراً لتبديل الواجهة بالكامل والتسوق كعميل مختلف.'
  : 'One platform, completely distinct storefronts: every tenant gets its own categories, products, colors and fonts. Pick one to fully re-skin the site and shop as a different customer.';

$('sf-grid').innerHTML = Object.values(TENANTS).map(tn => {
  const v = tn.theme.vars;
  const isActive = tn.id === ACTIVE_TENANT_ID;
  const fontFamily = v['font-display'];
  const catsPreview = tn.cats.slice(0,4).map((c,i) => `<span class="sf-cat-chip" style="background:${c.tint};color:${c.ink};">${ar?c.ar:c.en}</span>`).join('');
  return `<div class="sf-card" style="border-color:${v.border};background:${v.card};">
    <div class="sf-hero" style="background:${v.navy};color:#fff;">
      ${isActive ? `<span class="sf-active-badge" style="background:rgba(255,255,255,0.18);color:#fff;">${ar?'المتجر النشط الآن':'Currently active'}</span>` : ''}
      <div style="font-family:${fontFamily};font-weight:${v['font-display-weight']};font-style:${v['font-display-style']};font-size:34px;">${tn.emoji} ${tn.name}</div>
      <div style="font-size:13.5px;line-height:1.6;opacity:0.85;max-width:380px;">${ar ? tn.blurb.ar : tn.blurb.en}</div>
    </div>
    <div class="sf-body">
      <div>
        <div style="font-size:11.5px;font-weight:800;color:${v.muted};text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;">${ar?'فئات مختارة':'Featured categories'}</div>
        <div class="sf-cats">${catsPreview}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:${v.muted2};">
        <span>${tn.products.length} ${ar?'منتجاً':'products'}</span>·<span>${tn.brandsAll.length} ${ar?'علامة تجارية':'brands'}</span>·<span>${tn.cats.length} ${ar?'فئات':'categories'}</span>
      </div>
      <button onclick="switchTenant('${tn.id}')" style="margin-top:auto;background:${v.blue};color:#fff;border:none;border-radius:999px;padding:13px 20px;font-weight:800;font-size:13.5px;cursor:pointer;">
        ${isActive ? (ar?'تصفح المتجر →':'Browse this store →') : (ar?'← التبديل إلى هذا المتجر':'Switch to this store →')}
      </button>
    </div>
  </div>`;
}).join('');
</script>
</body>
</html>
