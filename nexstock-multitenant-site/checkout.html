<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — NexStock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container-narrow">
  <div class="crumb"><a href="cart.html" id="ck-cart"></a> / <span class="cur" id="ck-checkout"></span></div>
  <h1 id="ck-title" style="font-size:clamp(26px,3.2vw,38px);margin-bottom:24px;"></h1>
  <div style="display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap;" id="ck-steps"></div>
  <div class="row" style="align-items:flex-start;">
    <div style="flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px;">
      <div class="panel">
        <div style="font-size:15px;font-weight:900;margin-bottom:18px;" id="ck-contact-h"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px,1fr));gap:12px;">
          <input id="ck-name" class="formrow" placeholder="">
          <input id="ck-phone" class="formrow" placeholder="">
          <input id="ck-email" class="formrow" style="grid-column:1/-1;" placeholder="">
        </div>
      </div>
      <div class="panel">
        <div style="font-size:15px;font-weight:900;margin-bottom:18px;" id="ck-delivery-h"></div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;" id="ck-shipopts"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px,1fr));gap:12px;">
          <input id="ck-address" class="formrow" style="grid-column:1/-1;" placeholder="">
          <input id="ck-city" class="formrow" placeholder="">
          <input id="ck-notes" class="formrow" placeholder="">
        </div>
      </div>
      <div class="panel">
        <div style="font-size:15px;font-weight:900;margin-bottom:18px;" id="ck-payment-h"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px,1fr));gap:10px;" id="ck-payopts"></div>
        <div id="ck-cardfields" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px,1fr));gap:12px;margin-top:16px;">
          <input class="formrow" style="grid-column:1/-1;" id="ck-cardnum">
          <input class="formrow" placeholder="MM / YY">
          <input class="formrow" placeholder="CVC">
        </div>
      </div>
    </div>
    <aside style="flex:1 1 300px;max-width:420px;">
      <div class="panel" style="background:var(--navy);color:#fff;border:none;">
        <div style="font-size:15px;font-weight:900;margin-bottom:18px;" id="ck-summary"></div>
        <div style="display:flex;flex-direction:column;gap:14px;margin-bottom:18px;" id="ck-lines"></div>
        <div style="border-top:1px solid rgba(255,255,255,0.12);padding-top:16px;display:flex;flex-direction:column;gap:10px;font-size:13px;">
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--subtext-dark2);" id="ck-subtotal-l"></span><span id="ck-subtotal-v" style="font-weight:700;"></span></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--subtext-dark2);" id="ck-shiplabel-l"></span><span id="ck-shiplabel-v" style="font-weight:700;"></span></div>
          <div style="display:flex;justify-content:space-between;" id="ck-disc-row"><span style="color:var(--subtext-dark2);" id="ck-disc-l"></span><span style="font-weight:700;color:#E8A0A0;" id="ck-disc-v"></span></div>
          <div style="border-top:1px solid rgba(255,255,255,0.12);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;"><span style="font-weight:800;" id="ck-total-l"></span><span style="font-size:21px;font-weight:900;" id="ck-total-v"></span></div>
        </div>
        <button class="btn btn-blue" style="width:100%;margin-top:20px;" id="ck-placeorder" onclick="placeOrder()"></button>
        <div id="ck-toast" class="toast" style="display:none;"></div>
        <div style="font-size:11.5px;color:var(--subtext-dark2);text-align:center;margin-top:14px;line-height:1.6;" id="ck-secure"></div>
      </div>
    </aside>
  </div>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome('shop');
const K = t('checkout'); const ar = isAr();
$('ck-cart').textContent = K.cart; $('ck-checkout').textContent = K.checkout; $('ck-title').textContent = K.checkout;
$('ck-contact-h').textContent = K.contact; $('ck-name').placeholder = K.fullName; $('ck-phone').placeholder = K.phone; $('ck-email').placeholder = K.email;
$('ck-delivery-h').textContent = K.delivery; $('ck-address').placeholder = K.address; $('ck-city').placeholder = K.city; $('ck-notes').placeholder = K.notes;
$('ck-payment-h').textContent = K.payment; $('ck-cardnum').placeholder = K.cardNumber;
$('ck-summary').textContent = K.summary; $('ck-subtotal-l').textContent = K.subtotal; $('ck-shiplabel-l').textContent = K.shipLabel; $('ck-disc-l').textContent = K.discount; $('ck-total-l').textContent = K.total;
$('ck-placeorder').textContent = K.placeOrder; $('ck-secure').textContent = K.secure;

$('ck-steps').innerHTML = K.steps.map((label,i) => `<div style="display:flex;align-items:center;gap:9px;background:var(--blue-tint);border:1px solid var(--blue-tint-border);border-radius:999px;padding:8px 16px;"><span style="width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;">${i+1}</span><span style="font-size:12.5px;font-weight:800;color:var(--navy);">${label}</span></div>`).join('');

let ship = 0, pay = 0;
function renderShip(){ $('ck-shipopts').innerHTML = K.shipOpts.map((o,i) => `<div onclick="ship=${i};renderShip();renderSummary();" style="display:flex;align-items:center;gap:14px;border:1.5px solid ${ship===i?'var(--blue)':'var(--border2)'};background:${ship===i?'var(--blue-tint)':'var(--bg)'};border-radius:14px;padding:14px 16px;cursor:pointer;">
  <span style="width:18px;height:18px;border-radius:50%;border:2px solid ${ship===i?'var(--blue)':'#C9C3B4'};display:flex;align-items:center;justify-content:center;"><span style="width:9px;height:9px;border-radius:50%;background:${ship===i?'var(--blue)':'transparent'};"></span></span>
  <div style="flex:1;"><div style="font-size:13.5px;font-weight:800;">${o[0]}</div><div style="font-size:12px;color:var(--muted);">${o[1]}</div></div>
  <span style="font-size:13px;font-weight:900;color:${i===0?'var(--green)':'var(--ink)'};">${o[2]}</span></div>`).join(''); }
function renderPay(){ $('ck-payopts').innerHTML = K.payOpts.map((o,i) => `<div onclick="pay=${i};renderPay();" style="border:1.5px solid ${pay===i?'var(--blue)':'var(--border2)'};background:${pay===i?'var(--blue-tint)':'var(--bg)'};border-radius:14px;padding:16px 14px;cursor:pointer;text-align:center;"><div style="font-size:13.5px;font-weight:900;margin-bottom:3px;">${o[0]}</div><div style="font-size:11.5px;color:var(--muted);">${o[1]}</div></div>`).join('');
  $('ck-cardfields').style.display = pay === 0 ? 'grid' : 'none'; }
renderShip(); renderPay();

function isPromoApplied(){ return localStorage.getItem('nexstock-promo') === '1'; }
function renderSummary(){
  const lines = cartLines();
  $('ck-lines').innerHTML = lines.length ? lines.map(l => `<div style="display:flex;gap:12px;align-items:center;">
    <div style="width:52px;height:52px;border-radius:10px;overflow:hidden;flex-shrink:0;">${ph(l.p.cat,'','',l.p.img)}</div>
    <div style="flex:1;min-width:0;"><div style="font-size:12.5px;font-weight:700;line-height:1.3;">${ar?l.p.ar:l.p.en}</div><div style="font-size:11.5px;color:var(--subtext-dark2);">× ${l.qty}</div></div>
    <span style="font-size:12.5px;font-weight:800;">${fmt(l.line)}</span></div>`).join('') : `<div style="font-size:13px;color:var(--subtext-dark2);">${ar?'سلتك فارغة':'Your cart is empty'}</div>`;
  const subtotal = cartSubtotal();
  const shipCost = ship === 1 ? 8000 : 0;
  const discount = (isPromoApplied() && subtotal > 0) ? 10000 : 0;
  $('ck-subtotal-v').textContent = fmt(subtotal);
  $('ck-shiplabel-v').textContent = shipCost === 0 ? (ar?'مجاني':'Free') : fmt(shipCost);
  $('ck-disc-row').style.display = discount ? 'flex' : 'none';
  $('ck-disc-v').textContent = '− ' + fmt(discount);
  $('ck-total-v').textContent = fmt(Math.max(0, subtotal + shipCost - discount));
}
renderSummary();

function placeOrder(){
  const name = $('ck-name').value.trim(), phone = $('ck-phone').value.trim(), email = $('ck-email').value.trim();
  if (!name || !phone || !email){ showToast(K.fillRequired); return; }
  if (!cartLines().length){ showToast(ar?'سلتك فارغة':'Your cart is empty'); return; }
  const box = $('ck-toast'); box.style.display='block'; box.textContent = K.orderedMsg;
  $('ck-placeorder').disabled = true;
  localStorage.removeItem('nexstock-cart'); localStorage.removeItem('nexstock-promo');
  updateCartBadge();
  setTimeout(()=>{ location.href = 'track-order.html'; }, 1600);
}
</script>
</body>
</html>
