<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — NexStock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;">
    <span style="width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;" id="ac-avatar"></span>
    <div>
      <h1 id="ac-hello" style="font-size:clamp(22px,2.8vw,32px);"></h1>
      <div style="font-size:13px;color:var(--muted);" id="ac-email"></div>
    </div>
  </div>
  <div class="row" style="align-items:flex-start;">
    <aside style="flex:1 1 220px;max-width:290px;min-width:210px;" class="card" style="display:flex;flex-direction:column;gap:4px;">
      <div id="ac-menu"></div>
      <div style="border-top:1px solid var(--border3);margin:6px 12px;"></div>
      <a href="login.html" onclick="logoutUser();" style="display:block;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--red);" id="ac-signout"></a>
    </aside>
    <div style="flex:3 1 460px;min-width:0;display:flex;flex-direction:column;gap:16px;" id="ac-content"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome('home');
const A = t('account'); const ar = isAr();
const user = getUser() || { name:'Amina Koné', email:'amina@email.com' };
$('ac-avatar').textContent = (user.name||'A')[0].toUpperCase();
$('ac-hello').textContent = (ar ? 'أهلاً، ' : 'Hello, ') + user.name.split(' ')[0];
$('ac-email').textContent = `${user.email} · ${A.memberSince}`;
$('ac-signout').textContent = A.signOut;

let tab = 0;
function renderMenu(){
  $('ac-menu').innerHTML = A.menu.map((label,i) => `<div onclick="tab=${Math.min(i,2)}; if(${i}===3){location.href='wishlist.html';} else if(${i}===5){location.href='help.html';} else {renderMenu();renderContent();}" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:${tab===i?800:600};color:${tab===i?'var(--blue)':'var(--text2)'};background:${tab===i?'var(--blue-tint)':'transparent'};">
    <span>${label}</span>${i===0?'<span style="background:var(--blue);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;">2</span>':''}</div>`).join('');
}
function renderContent(){
  if (tab===0){
    const stMap = { delivered:['var(--greenBg)','var(--green)'], transit:['var(--blue-tint)','var(--blue)'] };
    $('ac-content').innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(170px,1fr));">${A.stats.map(s=>`<div class="card"><div style="font-size:24px;font-weight:900;color:var(--blue);">${s[0]}</div><div style="font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px;">${s[1]}</div></div>`).join('')}</div>
      <div class="panel"><div style="font-size:15px;font-weight:900;margin-bottom:16px;">${A.recentOrders}</div><div style="display:flex;flex-direction:column;gap:10px;">
      ${A.orders.map(o=>`<div style="border:1px solid var(--border3);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;">
        <div style="flex:1 1 150px;min-width:0;"><div style="font-size:13.5px;font-weight:800;">${o[0]}</div><div style="font-size:12px;color:var(--muted);margin-top:2px;">${o[1]} · ${o[2]}</div></div>
        <span style="background:${stMap[o[3]][0]};color:${stMap[o[3]][1]};font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:999px;">${A.statuses[o[3]]}</span>
        <div style="font-size:14px;font-weight:900;min-width:110px;text-align:end;">${o[4]}</div>
        <a href="track-order.html" style="font-size:12.5px;font-weight:800;">${A.trackIt}</a></div>`).join('')}
      </div></div>`;
  } else if (tab===1){
    $('ac-content').innerHTML = `<div class="panel"><div style="font-size:15px;font-weight:900;margin-bottom:16px;">${A.profileTitle}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px,1fr));gap:12px;">
        <input class="formrow" value="${user.name}"><input class="formrow" value="${user.email}"><input class="formrow" value="+225 07 08 09 10"><input class="formrow" placeholder="${A.city}" value="Abidjan"></div>
      <button class="btn btn-dark" style="margin-top:16px;" onclick="showToast('${A.saved}')">${A.save}</button></div>`;
  } else {
    $('ac-content').innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(240px,1fr));">
      ${A.addresses.map(a=>`<div class="card" style="border:1.5px solid ${a[2]?'var(--blue)':'var(--border)'};padding:22px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span style="font-size:13.5px;font-weight:900;">${a[0]}</span>${a[2]?`<span style="background:var(--blue-tint);color:var(--blue);font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;">${A.default}</span>`:''}</div>
        <div style="font-size:13px;color:var(--muted2);line-height:1.7;white-space:pre-line;">${a[1]}</div>
        <div style="display:flex;gap:16px;margin-top:14px;"><span style="font-size:12.5px;font-weight:800;color:var(--blue);cursor:pointer;">${A.edit}</span><span style="font-size:12.5px;font-weight:800;color:var(--red);cursor:pointer;">${A.delete}</span></div></div>`).join('')}
      <div style="border:1.5px dashed var(--card-border-hover);border-radius:18px;padding:22px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer;min-height:140px;">+ ${A.addAddress}</div></div>`;
  }
}
renderMenu(); renderContent();
</script>
</body>
</html>
