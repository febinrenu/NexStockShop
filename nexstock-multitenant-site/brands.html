<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brands — NexStock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container" style="display:flex;flex-direction:column;gap:clamp(32px,4vw,48px);">
  <div style="text-align:center;padding:clamp(20px,4vw,44px) 0 0;">
    <div class="eyebrow" id="br-eyebrow"></div>
    <h1 id="br-title" style="font-size:clamp(30px,4vw,48px);max-width:640px;margin:0 auto 12px;"></h1>
    <p class="muted" id="br-sub" style="max-width:480px;margin:0 auto;font-size:14.5px;line-height:1.6;"></p>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(280px,1fr));" id="br-featured"></div>
  <section>
    <div class="section-head"><h2 id="br-alltitle"></h2><div style="display:flex;gap:6px;flex-wrap:wrap;" id="br-letters"></div></div>
    <div class="grid grid-auto" id="br-grid"></div>
  </section>
  <div class="hero" style="background:var(--hero-gradient);color:var(--hero-text);padding:clamp(28px,4vw,48px);display:flex;flex-wrap:wrap;align-items:center;gap:24px;">
    <div style="flex:2 1 300px;">
      <div class="eyebrow" style="color:var(--hero-accent2);" id="br-partnereyebrow"></div>
      <div style="font-size:clamp(22px,2.6vw,32px);font-weight:900;line-height:1.15;margin-bottom:8px;" id="br-partnertitle"></div>
      <div class="muted" style="font-size:13.5px;line-height:1.6;max-width:520px;color:var(--hero-subtext);" id="br-partnersub"></div>
    </div>
    <a href="about.html" class="btn btn-white" id="br-partnercta"></a>
  </div>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome('brands');
const BR = t('brands'); const ar = isAr();
$('br-eyebrow').textContent = BR.eyebrow;
$('br-title').innerHTML = `${BR.titleA} <span class="serif">${BR.titleB}</span>`;
$('br-sub').textContent = BR.sub;
$('br-featured').innerHTML = BR.featured.map((b,i)=>`<div class="card" style="background:${b[2]};color:${b[3]};padding:28px;display:flex;gap:16px;align-items:center;min-height:160px;border:none;">
  <div style="flex:1.2;"><div style="font-size:22px;font-weight:900;margin-bottom:4px;">${b[0]}</div><div style="font-size:12.5px;opacity:0.75;margin-bottom:12px;">${b[1]}</div><span style="font-size:12.5px;font-weight:800;text-decoration:underline;">${BR.shopBrand}</span></div>
  <div style="flex:0.9;height:110px;border-radius:14px;overflow:hidden;">${ph(i%10,'')}</div></div>`).join('');
$('br-alltitle').textContent = BR.allBrands;
$('br-letters').innerHTML = ['A','B','C','D','H','J','L','N','O','P','S','X'].map(l=>`<span style="min-width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--muted2);background:var(--card);border:1px solid var(--border2);cursor:pointer;">${l}</span>`).join('');
const tints = [['var(--blue-tint)','var(--blue)'],['var(--sand)','#8A6A2F'],['var(--greenBg)','var(--green)'],['#F2E3E0','#A0522D'],['#E7E3F2','#5A4A9E'],['#E0EDEE','#2E6E74'],['#F5E9D8','#B07A2A'],['#E9E9E4','#4A4A42']];
$('br-grid').innerHTML = BRANDS_ALL.map((b,i)=>{
  const count = PRODUCTS.filter(p=>p.brand===b).length;
  return `<a href="shop.html" class="card" style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink);padding:24px 18px;">
  <span style="width:58px;height:58px;border-radius:50%;background:${tints[i%8][0]};color:${tints[i%8][1]};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;">${b[0]}</span>
  <span style="font-size:15px;font-weight:800;">${b}</span><span class="muted" style="font-size:11.5px;font-weight:600;">${count} ${BR.products}</span></a>`;
}).join('');
$('br-partnereyebrow').textContent = BR.partnerEyebrow; $('br-partnertitle').textContent = BR.partnerTitle; $('br-partnersub').textContent = BR.partnerSub; $('br-partnercta').textContent = BR.partnerCta;
</script>
</body>
</html>
