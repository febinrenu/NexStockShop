<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — NexStock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="container" style="display:flex;flex-direction:column;gap:clamp(32px,4vw,44px);">
  <div class="crumb"><a href="index.html" id="pd-home"></a> / <a href="shop.html" id="pd-shop"></a> / <span class="cur" id="pd-name"></span></div>
  <div class="row" style="align-items:flex-start;">
    <div style="flex:1.1 1 340px;min-width:0;">
      <div class="card" style="overflow:hidden;height:clamp(300px,42vw,460px);position:relative;padding:0;">
        <span id="pd-badge" class="badge badge-red" style="display:none;"></span>
        <div id="pd-mainimg" style="height:100%;"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;" id="pd-thumbs"></div>
    </div>
    <div style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:18px;">
      <div>
        <div class="eyebrow" id="pd-brandline"></div>
        <h1 id="pd-title" style="margin:0 0 10px;font-size:clamp(24px,3vw,36px);line-height:1.1;"></h1>
        <div style="font-size:13px;color:var(--muted);"><span style="color:var(--gold);" id="pd-stars"></span> <span id="pd-rating"></span> · <a href="#reviews" id="pd-reviewlink"></a></div>
      </div>
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
        <span id="pd-price" style="font-size:clamp(26px,3vw,34px);font-weight:900;"></span>
        <span id="pd-oldprice" class="pold" style="font-size:16px;"></span>
        <span id="pd-save" style="background:var(--greenBg);color:var(--green);font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;display:none;"></span>
      </div>
      <div>
        <div style="font-size:12.5px;font-weight:800;margin-bottom:10px;" id="pd-colorlabel"></div>
        <div style="display:flex;gap:10px;" id="pd-colors"></div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
        <div class="stepper"><button onclick="changeQty(-1)">−</button><span id="pd-qty">1</span><button onclick="changeQty(1)">+</button></div>
        <button class="btn btn-dark" style="flex:1 1 180px;min-height:48px;" id="pd-addbtn" onclick="addCurrentToCart()"></button>
        <a href="cart.html" class="btn btn-blue" style="min-height:48px;" id="pd-buybtn" onclick="addCurrentToCart()"></a>
      </div>
      <div class="panel" style="display:flex;flex-direction:column;gap:10px;padding:16px 18px;">
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--green);"></span><span id="pd-ship1"></span></div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--blue);"></span><span id="pd-ship2"></span></div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;"><span style="width:8px;height:8px;border-radius:50%;background:#B07A2A;"></span><span id="pd-ship3"></span></div>
      </div>
    </div>
  </div>
  <section>
    <div style="display:flex;gap:4px;border-bottom:1px solid var(--border);flex-wrap:wrap;" id="pd-tabs"></div>
    <div style="padding:24px 4px;max-width:820px;" id="pd-tabcontent"></div>
  </section>
  <section>
    <div class="section-head"><h2 id="pd-related-title"></h2><a href="shop.html" id="pd-related-seeall"></a></div>
    <div class="grid grid-auto" id="pd-related"></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome('shop');
const P = t('product'); const ar = isAr();
const prod = getProduct(qs('id')) || PRODUCTS[0];
let qty = 1, tab = 0, color = 0;

$('pd-home').textContent = P.home; $('pd-shop').textContent = P.shop;
$('pd-name').textContent = ar ? prod.ar : prod.en;
document.title = (ar ? prod.ar : prod.en) + ' — ' + TENANT.name;
$('pd-mainimg').innerHTML = ph(prod.cat, ar?prod.ar:prod.en, '', prod.img);
$('pd-thumbs').innerHTML = [1,2,3,4].map(()=>`<div style="height:82px;border-radius:14px;overflow:hidden;">${ph(prod.cat,'','',prod.img)}</div>`).join('');
if (prod.badge){ const b=$('pd-badge'); b.style.display='inline-block'; b.textContent = ar && prod.badge==='NEW' ? 'جديد' : prod.badge; b.style.position='absolute'; b.style.top='18px'; b.style.insetInlineStart='18px'; }
$('pd-brandline').textContent = `${prod.brand} · ${P.inStock}`;
$('pd-title').textContent = ar ? prod.ar : prod.en;
$('pd-stars').textContent = starBar(prod.rating);
$('pd-rating').textContent = prod.rating;
$('pd-reviewlink').textContent = `${prod.reviews} ${P.reviews}`;
$('pd-price').textContent = fmt(prod.price);
if (prod.old){ $('pd-oldprice').textContent = fmt(prod.old); const s=$('pd-save'); s.style.display='inline-block'; s.textContent = (ar?'وفّر ':'Save ') + fmt(prod.old-prod.price); }
$('pd-colorlabel').textContent = P.color;
const swatches = ['#9DB4D4','#3B3B3D','#CBD6C4','#EDD5D2'];
function renderColors(){ $('pd-colors').innerHTML = swatches.map((hex,i)=>`<span onclick="color=${i};renderColors();" style="width:34px;height:34px;border-radius:50%;background:${hex};cursor:pointer;border:2px solid ${color===i?'var(--blue)':'var(--border2)'};box-shadow:inset 0 0 0 3px var(--bg);"></span>`).join(''); }
renderColors();
$('pd-addbtn').textContent = P.addToCart; $('pd-buybtn').textContent = P.buyNow;
$('pd-ship1').textContent = P.ship1; $('pd-ship2').textContent = P.ship2; $('pd-ship3').textContent = P.ship3;

function changeQty(d){ qty = Math.max(1, qty+d); $('pd-qty').textContent = qty; }
function addCurrentToCart(){ addToCart(prod.id, qty); }

const specs = [[ar?'العلامة':'Brand', prod.brand], [ar?'الفئة':'Category', ar?CATS[prod.cat].ar:CATS[prod.cat].en], ...P.specs.slice(2)];
function renderTabs(){
  $('pd-tabs').innerHTML = P.tabs.map((label,i)=>`<button onclick="tab=${i};renderTabs();" style="background:transparent;border:none;border-bottom:2.5px solid ${tab===i?'var(--blue)':'transparent'};padding:13px 18px;font-size:14px;font-weight:${tab===i?800:600};color:${tab===i?'var(--ink)':'var(--muted)'};cursor:pointer;">${label}${i===2?' ('+prod.reviews+')':''}</button>`).join('');
  let html = '';
  if (tab===0) html = `<p style="margin:0 0 14px;font-size:14.5px;line-height:1.75;color:var(--text2);">${P.descP1}</p><p style="margin:0;font-size:14.5px;line-height:1.75;color:var(--text2);">${P.descP2}</p>`;
  else if (tab===1) html = `<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px,1fr));gap:0 32px;">${specs.map(s=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--border3);font-size:13.5px;"><span style="color:var(--muted);font-weight:600;">${s[0]}</span><span style="font-weight:700;">${s[1]}</span></div>`).join('')}</div>`;
  else html = `<div style="display:flex;flex-direction:column;gap:14px;">${P.reviewList.map(r=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;"><span style="font-size:13.5px;font-weight:800;">${r.name}</span><span style="font-size:12.5px;color:var(--gold);">${r.stars}</span></div><p style="margin:0;font-size:13.5px;line-height:1.65;color:var(--text2);">${r.text}</p></div>`).join('')}</div>`;
  $('pd-tabcontent').innerHTML = html;
}
renderTabs();

$('pd-related-title').textContent = P.related; $('pd-related-seeall').textContent = P.seeAll;
const relPool = [...PRODUCTS.filter(p=>p.cat===prod.cat && p.id!==prod.id), ...PRODUCTS.filter(p=>p.id!==prod.id)];
const seenIds = new Set(); const related = [];
for (const rp of relPool){ if (!seenIds.has(rp.id)){ seenIds.add(rp.id); related.push(rp); if (related.length>=4) break; } }
$('pd-related').innerHTML = related.map(p => productCard(p, {wish:true})).join('');
</script>
</body>
</html>
