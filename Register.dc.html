<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#F4F2ED; color:#12151A; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#1E5FD6; text-decoration:none; }
a:hover { color:#0B1F3F; }
input { box-sizing:border-box; }
</style>
</helmet>
<dc-import name="StoreHeader" lang="{{ lang }}" active="home" cart-count="0" on-set-lang="{{ setLang }}" hint-size="100%,220px"></dc-import>
<main dir="{{ dir }}" style="max-width:1100px; margin:0 auto; padding:clamp(24px,4vw,56px) clamp(16px,4vw,32px) 70px; display:flex; flex-wrap:wrap; gap:clamp(24px,4vw,56px); align-items:stretch; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif;">
  <div style="flex:1 1 340px; background:#FDFCFA; border:1px solid #E7E3DA; border-radius:24px; padding:clamp(28px,4vw,48px); display:flex; flex-direction:column; justify-content:center; gap:18px;">
    <div>
      <h1 style="margin:0 0 6px; font-size:26px; font-weight:900; letter-spacing:-0.02em;">{{ t.title }}</h1>
      <div style="font-size:13.5px; color:#8A857A;">{{ t.sub }} <a href="Login.dc.html" style="font-weight:800;">{{ t.signIn }}</a></div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px;">
      <div style="grid-column:1 / -1;">
        <div style="font-size:12.5px; font-weight:800; margin-bottom:7px;">{{ t.fullName }}</div>
        <input placeholder="{{ t.namePh }}" style="width:100%; border:1.5px solid #E3DFD4; border-radius:12px; padding:14px 16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14px; outline:none; background:#F4F2ED;">
      </div>
      <div>
        <div style="font-size:12.5px; font-weight:800; margin-bottom:7px;">{{ t.email }}</div>
        <input placeholder="name@email.com" style="width:100%; border:1.5px solid #E3DFD4; border-radius:12px; padding:14px 16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14px; outline:none; background:#F4F2ED;">
      </div>
      <div>
        <div style="font-size:12.5px; font-weight:800; margin-bottom:7px;">{{ t.phone }}</div>
        <input placeholder="+225 00 00 00 00" style="width:100%; border:1.5px solid #E3DFD4; border-radius:12px; padding:14px 16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14px; outline:none; background:#F4F2ED;">
      </div>
      <div style="grid-column:1 / -1;">
        <div style="font-size:12.5px; font-weight:800; margin-bottom:7px;">{{ t.password }}</div>
        <input type="password" placeholder="••••••••" style="width:100%; border:1.5px solid #E3DFD4; border-radius:12px; padding:14px 16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14px; outline:none; background:#F4F2ED;">
        <div style="font-size:11.5px; color:#8A857A; margin-top:6px;">{{ t.passHint }}</div>
      </div>
    </div>
    <label style="display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:#5C594F; cursor:pointer; line-height:1.5;"><input type="checkbox" style="accent-color:#1E5FD6; width:16px; height:16px; margin-top:1px;">{{ t.terms }}</label>
    <button onClick="{{ doRegister }}" style="width:100%; background:#1E5FD6; color:#fff; border:none; border-radius:999px; padding:16px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:14.5px; font-weight:800; cursor:pointer;" style-hover="background:#0B1F3F;">{{ t.createBtn }}</button>
    <sc-if value="{{ registered }}" hint-placeholder-val="{{ false }}">
      <div style="background:#DFE8DC; color:#3E5C38; border-radius:12px; padding:12px 16px; font-size:12.5px; font-weight:700; text-align:center;">{{ t.success }}</div>
    </sc-if>
    <div style="display:flex; align-items:center; gap:14px; color:#B0AA9B; font-size:12px;"><span style="flex:1; height:1px; background:#ECE8DF;"></span>{{ t.or }}<span style="flex:1; height:1px; background:#ECE8DF;"></span></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button style="flex:1 1 130px; border:1.5px solid #E3DFD4; background:#F4F2ED; border-radius:999px; padding:13px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:13px; font-weight:800; cursor:pointer; color:#3B3830;" style-hover="border-color:#1E5FD6;">Google</button>
      <button style="flex:1 1 130px; border:1.5px solid #E3DFD4; background:#F4F2ED; border-radius:999px; padding:13px; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; font-size:13px; font-weight:800; cursor:pointer; color:#3B3830;" style-hover="border-color:#1E5FD6;">Apple</button>
    </div>
  </div>
  <div style="flex:1 1 340px; background:#EAE2D3; border-radius:24px; padding:clamp(28px,4vw,48px); display:flex; flex-direction:column; justify-content:space-between; gap:28px; min-height:420px;">
    <div>
      <div style="font-size:11px; letter-spacing:0.2em; font-weight:700; color:#8A7A5A; text-transform:uppercase; margin-bottom:14px;">{{ t.whyEyebrow }}</div>
      <h2 style="margin:0 0 14px; font-size:clamp(26px,3vw,38px); font-weight:900; letter-spacing:-0.03em; line-height:1.08;">{{ t.whyA }} <span style="font-family:'Instrument Serif','IBM Plex Sans Arabic',serif; font-style:italic; font-weight:400; color:#8A6A2F;">{{ t.whyB }}</span></h2>
      <p style="margin:0; font-size:14px; line-height:1.7; color:#5C594F; max-width:380px; text-wrap:pretty;">{{ t.whySub }}</p>
    </div>
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px;">
      <sc-for list="{{ perks }}" as="p" hint-placeholder-count="4">
        <div style="background:rgba(255,255,255,0.55); border-radius:16px; padding:18px;">
          <div style="font-size:20px; font-weight:900; color:#8A6A2F; margin-bottom:4px;">{{ p.n }}</div>
          <div style="font-size:12.5px; font-weight:700; color:#3B3830; line-height:1.4;">{{ p.label }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</main>
<dc-import name="StoreFooter" lang="{{ lang }}" hint-size="100%,480px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('nexstock-lang')) || 'en', registered: false };
  renderVals() {
    const lang = this.state.lang; const ar = lang === 'ar';
    const T = {
      en: { title: 'Create your account', sub: 'Already a member?', signIn: 'Sign in', fullName: 'Full name', namePh: 'Your name', email: 'Email address', phone: 'Phone number', password: 'Password', passHint: 'At least 8 characters, with one number.', terms: 'I agree to the Terms & Conditions and Privacy Policy.', createBtn: 'Create account', success: '✓ Account created — welcome to NexStock!', or: 'or sign up with', whyEyebrow: 'Member benefits', whyA: 'Shopping,', whyB: 'upgraded.', whySub: 'A free account unlocks faster checkout, live order tracking and member-only pricing.',
        perks: [{ n: '−5%', label: 'Welcome discount on first order' }, { n: '24/7', label: 'Priority customer support' }, { n: '1-tap', label: 'Checkout with saved details' }, { n: '∞', label: 'Wishlist synced everywhere' }] },
      ar: { title: 'أنشئ حسابك', sub: 'عضو بالفعل؟', signIn: 'تسجيل الدخول', fullName: 'الاسم الكامل', namePh: 'اسمك', email: 'البريد الإلكتروني', phone: 'رقم الهاتف', password: 'كلمة المرور', passHint: '8 أحرف على الأقل، مع رقم واحد.', terms: 'أوافق على الشروط والأحكام وسياسة الخصوصية.', createBtn: 'إنشاء حساب', success: '✓ تم إنشاء الحساب — أهلاً بك في نكستوك!', or: 'أو سجّل باستخدام', whyEyebrow: 'مزايا العضوية', whyA: 'تسوّق', whyB: 'بمستوى أرقى.', whySub: 'الحساب المجاني يمنحك دفعاً أسرع وتتبعاً مباشراً للطلبات وأسعاراً حصرية للأعضاء.',
        perks: [{ n: '−5%', label: 'خصم ترحيبي على أول طلب' }, { n: '24/7', label: 'دعم عملاء ذو أولوية' }, { n: 'نقرة', label: 'دفع سريع ببيانات محفوظة' }, { n: '∞', label: 'مفضلة متزامنة في كل مكان' }] }
    }[lang];
    return {
      lang, dir: ar ? 'rtl' : 'ltr', t: T, perks: T.perks, registered: this.state.registered,
      doRegister: () => this.setState({ registered: true }),
      setLang: (l) => { try { localStorage.setItem('nexstock-lang', l); } catch(e) {} this.setState({ lang: l }); }
    };
  }
}
</script>
</body>
</html>
