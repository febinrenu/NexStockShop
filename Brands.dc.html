<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="image-slot.js"></script>
<style>
body { margin:0; background:#F4F2ED; color:#12151A; font-family:'Archivo','IBM Plex Sans Arabic',sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#1E5FD6; text-decoration:none; }
a:hover { color:#0B1F3F; }
</style>
</helmet>
<dc-import name="StoreHeader" lang="{{ lang }}" active="brands" cart-count="0" on-set-lang="{{ setLang }}" hint-size="100%,220px"></dc-import>
<main dir="{{ dir }}" style="max-width:1320px; margin:0 auto; padding:clamp(16px,3vw,28px) clamp(16px,4vw,32px) 60px; display:flex; flex-direction:column; gap:clamp(32px,4vw,48px); font-family:'Archivo','IBM Plex Sans Arabic',sans-serif;">
  <div style="text-align:center; padding:clamp(20px,4vw,44px) 0 0;">
    <div style="font-size:11px; letter-spacing:0.22em; font-weight:700; color:#1E5FD6; text-transform:uppercase; margin-bottom:12px;">{{ t.eyebrow }}</div>
    <h1 style="margin:0 auto 12px; font-size:clamp(30px,4vw,48px); font-weight:900; letter-spacing:-0.03em; max-width:640px;">{{ t.titleA }} <span style="font-family:'Instrument Serif','IBM Plex Sans Arabic',serif; font-style:italic; font-weight:400; color:#1E5FD6;">{{ t.titleB }}</span></h1>
    <p style="margin:0 auto; font-size:14.5px; color:#8A857A; max-width:480px; line-height:1.6; text-wrap:pretty;">{{ t.sub }}</p>
  </div>
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px;">
    <sc-for list="{{ featured }}" as="b" hint-placeholder-count="3">
      <div style="background:{{ b.bg }}; color:{{ b.fg }}; border-radius:22px; padding:28px; display:flex; gap:16px; align-items:center; min-height:160px; cursor:pointer;" style-hover="transform:translateY(-3px); box-shadow:0 16px 40px rgba(11,31,63,0.14);">
        <div style="flex:1.2;">
          <div style="font-size:22px; font-weight:900; letter-spacing:0.02em; margin-bottom:4px;">{{ b.name }}</div>
          <div style="font-size:12.5px; opacity:0.75; margin-bottom:12px;">{{ b.tag }}</div>
          <span style="font-size:12.5px; font-weight:800; text-decoration:underline; text-underline-offset:3px;">{{ t.shopBrand }}</span>
        </div>
        <div style="flex:0.9; height:110px; border-radius:14px; overflow:hidden;"><image-slot id="{{ b.slot }}" shape="rounded" radius="14" placeholder="{{ b.ph }}"></image-slot></div>
      </div>
    </sc-for>
  </div>
  <section>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;">
      <h2 style="margin:0; font-size:clamp(22px,2.6vw,30px); font-weight:900; letter-spacing:-0.02em;">{{ t.allBrands }}</h2>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <sc-for list="{{ letters }}" as="l" hint-placeholder-count="8">
          <span style="min-width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800; color:#5C594F; background:#FDFCFA; border:1px solid #E3DFD4; cursor:pointer;" style-hover="border-color:#1E5FD6; color:#1E5FD6;">{{ l }}</span>
        </sc-for>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:14px;">
      <sc-for list="{{ brands }}" as="b" hint-placeholder-count="12">
        <a href="Shop.dc.html" style="background:#FDFCFA; border:1px solid #E7E3DA; border-radius:18px; padding:24px 18px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; color:#12151A;" style-hover="border-color:#1E5FD6; box-shadow:0 12px 30px rgba(11,31,63,0.10); transform:translateY(-3px); color:#12151A;">
          <span style="width:58px; height:58px; border-radius:50%; background:{{ b.tint }}; color:{{ b.ink }}; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900;">{{ b.mono }}</span>
          <span style="font-size:15px; font-weight:800; letter-spacing:0.03em;">{{ b.name }}</span>
          <span style="font-size:11.5px; color:#8A857A; font-weight:600;">{{ b.count }}</span>
        </a>
      </sc-for>
    </div>
  </section>
  <div style="background:#0B1F3F; color:#fff; border-radius:24px; padding:clamp(28px,4vw,48px); display:flex; flex-wrap:wrap; align-items:center; gap:24px;">
    <div style="flex:2 1 300px;">
      <div style="font-size:11px; letter-spacing:0.18em; font-weight:700; color:#7FA8E8; text-transform:uppercase; margin-bottom:10px;">{{ t.partnerEyebrow }}</div>
      <div style="font-size:clamp(22px,2.6vw,32px); font-weight:900; letter-spacing:-0.02em; line-height:1.15; margin-bottom:8px;">{{ t.partnerTitle }}</div>
      <div style="font-size:13.5px; color:#B9C8E2; line-height:1.6; max-width:520px;">{{ t.partnerSub }}</div>
    </div>
    <a href="About.dc.html" style="background:#fff; color:#0B1F3F; border-radius:999px; padding:14px 30px; font-size:14px; font-weight:800; white-space:nowrap;">{{ t.partnerCta }}</a>
  </div>
</main>
<dc-import name="StoreFooter" lang="{{ lang }}" hint-size="100%,480px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('nexstock-lang')) || 'en' };
  renderVals() {
    const lang = this.state.lang; const ar = lang === 'ar';
    const T = {
      en: { eyebrow: '60+ official partners', titleA: 'Shop the brands', titleB: 'you trust.', sub: '100% original products, sourced directly from official distributors with full local warranty.', shopBrand: 'Shop brand →', allBrands: 'All brands', partnerEyebrow: 'For businesses', partnerTitle: 'Sell your brand on NexStock', partnerSub: 'Reach thousands of customers across the region. Onboarding takes less than a week — logistics, payments and support included.', partnerCta: 'Become a partner', products: 'products' },
      ar: { eyebrow: 'أكثر من 60 شريكاً رسمياً', titleA: 'تسوّق العلامات', titleB: 'التي تثق بها.', sub: 'منتجات أصلية 100%، مستوردة مباشرة من الموزعين الرسميين مع ضمان محلي كامل.', shopBrand: '← تسوّق العلامة', allBrands: 'كل العلامات التجارية', partnerEyebrow: 'للشركات', partnerTitle: 'اعرض علامتك التجارية على نكستوك', partnerSub: 'اوصل إلى آلاف العملاء في المنطقة. الانضمام يستغرق أقل من أسبوع — يشمل الخدمات اللوجستية والمدفوعات والدعم.', partnerCta: 'كن شريكاً', products: 'منتجاً' }
    }[lang];
    const featured = [
      { name: 'Apple', tag: ar ? 'التشكيلة الكاملة + ضمان رسمي' : 'Full lineup + official warranty', bg: '#12151A', fg: '#FDFCFA', slot: 'brand-feat-1', ph: 'Apple products photo' },
      { name: 'SAMSUNG', tag: ar ? 'هواتف، تلفزيونات وأجهزة منزلية' : 'Phones, TVs & appliances', bg: '#E3EBFA', fg: '#0B1F3F', slot: 'brand-feat-2', ph: 'Samsung products photo' },
      { name: 'Dyson', tag: ar ? 'تقنيات منزلية متقدمة' : 'Advanced home technology', bg: '#EAE2D3', fg: '#12151A', slot: 'brand-feat-3', ph: 'Dyson products photo' }
    ];
    const tints = [['#E3EBFA','#1E5FD6'],['#EAE2D3','#8A6A2F'],['#DFE8DC','#3E5C38'],['#F2E3E0','#A0522D'],['#E7E3F2','#5A4A9E'],['#E0EDEE','#2E6E74'],['#F5E9D8','#B07A2A'],['#E9E9E4','#4A4A42']];
    const names = [['Apple',124],['Samsung',210],['Sony',86],['HP',64],['Xiaomi',92],['Canon',38],['Philips',75],['Dyson',22],['JBL',41],['Oppo',33],['Hisense',29],['Nestlé',58],['LG',67],['Lenovo',49],['Nike',83],['Adidas',71]];
    const brands = names.map((b, i) => ({ name: b[0], count: b[1] + ' ' + T.products, mono: b[0][0], tint: tints[i % 8][0], ink: tints[i % 8][1] }));
    return {
      lang, dir: ar ? 'rtl' : 'ltr', t: T, featured, brands,
      letters: ['A','B','C','D','H','J','L','N','O','P','S','X'],
      setLang: (l) => { try { localStorage.setItem('nexstock-lang', l); } catch(e) {} this.setState({ lang: l }); }
    };
  }
}
</script>
</body>
</html>
